services:
  - type: web
    name: rh-stream-backend
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_CHANNELS
        sync: false
      - key: TELEGRAM_MAX_STREAMS
        value: "2"
      - key: PUBLIC_BASE_URL
        value: https://rh-stream-backend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rh_stream
      - key: MONGODB_PLAYLIST_COLLECTION
        value: playlists
      - key: MONGODB_PLAYBACK_COLLECTION
        value: playback_progress
      - key: MONGODB_IPTV_COLLECTION
        value: iptv_sources
