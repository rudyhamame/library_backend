services:
  - type: web
    name: rh-library-backend
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://rh-library-backend.onrender.com
      - key: FRONTEND_URL
        value: https://rh-stream-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rh_stream
      - key: MONGODB_PLAYBACK_COLLECTION
        value: playback_progress
      - key: MONGODB_STREAMING_HISTORY_COLLECTION
        value: streaming_history
      - key: MONGODB_XTREAM_COLLECTION
        value: xtream_sources
      - key: MONGODB_LIBRARY_CATEGORY_COLLECTION
        value: library_categories
      - key: MONGODB_FAVORITES_COLLECTION
        value: favorites
      - key: MONGODB_AI_RECOMMENDATIONS_COLLECTION
        value: ai_recommendations
      - key: MONGODB_DEVICE_COLLECTION
        value: device_profiles
      - key: MONGODB_ACCOUNT_COLLECTION
        value: accounts
      - key: MONGODB_ACCOUNT_PROFILE_COLLECTION
        value: account_profiles
      - key: MAX_ACCOUNT_PROFILES
        value: "5"
      - key: DEVICE_AUTH_SECRET
        sync: false
      - key: INTERNAL_DIAGNOSTICS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: MAX_SAVED_AI_SAMPLE
        value: "32"
      - key: MAX_AI_CANDIDATES
        value: "100"
      - key: MAX_DESCRIPTION_LENGTH
        value: "200"
      - key: AI_RECOMMENDATION_TTL_HOURS
        value: "24"
      - key: AI_RECOMMENDATION_REFRESH_COOLDOWN_MINUTES
        value: "10"
      - key: MAX_GEMINI_RETRIES
        value: "2"
      - key: MAX_ACTIVE_TRANSCODES
        value: "1"
      - key: MAX_ACTIVE_REMUX_JOBS
        value: "2"
      - key: MAX_TOTAL_FFMPEG_JOBS
        value: "2"
      - key: MAX_JOBS_PER_USER
        value: "2"
      - key: MAX_JOBS_PER_DEVICE
        value: "1"
      - key: MAX_STARTUP_QUEUE
        value: "2"
      - key: MAX_VIEWERS_PER_MEDIA_JOB
        value: "64"
      - key: MEDIA_JOB_IDLE_TIMEOUT_MS
        value: "45000"
      - key: MEDIA_STREAM_IDLE_TIMEOUT_MS
        value: "45000"
      - key: MEMORY_SOFT_LIMIT_PERCENT
        value: "75"
      - key: MEMORY_HARD_LIMIT_PERCENT
        value: "88"
      - key: MAX_LOAD_PER_CPU
        value: "1.5"
      - key: HLS_MAX_SEGMENTS
        value: "36"
      - key: PREVIEW_CACHE_MAX_ENTRIES
        value: "12"
      - key: PREVIEW_CACHE_MAX_MB
        value: "12"
      - key: PREVIEW_CACHE_TTL_MS
        value: "3600000"
      - key: M3U_CACHE_MAX_ENTRIES
        value: "2"
      - key: M3U_MAX_MB
        value: "8"
      - key: M3U_MAX_IN_FLIGHT
        value: "2"
      - key: XTREAM_MAX_IN_FLIGHT
        value: "12"
      - key: DEBUG_MEDIA_LOGGING
        value: "false"
