services:
  - type: web
    name: rh-stream-backend
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://rh-stream-backend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rh_stream
      - key: MONGODB_PLAYBACK_COLLECTION
        value: playback_progress
      - key: MONGODB_XTREAM_COLLECTION
        value: xtream_sources
      - key: MONGODB_FAVORITES_COLLECTION
        value: favorites
